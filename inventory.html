<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة المخزون 2026 - السجانة ERP</title>
    <link rel="stylesheet" href="css/design-system.css"><link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css?v=20260616_2">
        <style>
        .search-container {
            padding: 20px 30px;
            max-width: 1600px;
            margin: 0 auto;
            position: sticky;
            top: 70px;
            z-index: 90;
        }
        .search-input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            background: var(--surface-color);
            color: var(--text-primary);
            font-size: 1.1rem;
            box-shadow: var(--shadow-sm);
            outline: none;
            transition: box-shadow 0.3s;
        }
        .search-input:focus {
            box-shadow: 0 0 10px var(--primary-accent);
        }
        .inventory-list {
            padding: 0 30px 100px 30px;
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .inventory-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .product-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-name {
            font-weight: 800;
            font-size: 1.2rem;
        }
        .product-sku {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-color);
            padding: 4px 8px;
            border-radius: 8px;
        }
        .balance-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .balance-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .balance-val {
            font-weight: 900;
            font-size: 1.1rem;
        }
        .balance-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .val-physical { color: var(--text-primary); }
        .val-reserved { color: var(--danger-color); }
        .val-available { color: var(--success-color); }

        /* Progress Bar for Stock */
        .stock-progress-container {
            width: 100%;
            height: 8px;
            background: var(--bg-color);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        .stock-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--success-color), #86efac);
            transition: width 1s ease-in-out;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-primary);
        }

        .no-results {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <!-- Ambient Animated Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>


            <!-- Unified Header -->
        <header class="premium-header" style="display:flex; justify-content:space-between; align-items:center; padding:15px; margin-bottom:15px; gap:15px; border-radius: 16px; width: 100%;">
            <!-- Left: Logo / Brand -->
            <div style="display:flex; align-items:center; gap:12px; flex:1;">
                <div style="background:linear-gradient(135deg,#38bdf8,#818cf8); width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">📦</div>
                <div>
                    <div style="color:#fff; font-weight:800; font-size:1rem; letter-spacing:0.5px;">السجانة ERP</div>
                    <div style="color:var(--text-secondary); font-size:0.7rem;">نظام الإدارة الشاملة</div>
                </div>
            </div>

            <!-- Center: Page Title -->
            <div style="flex:1; text-align:center;">
                <h2 style="margin:0; color:#fff; font-size:1.2rem; font-weight:900; white-space:nowrap; text-shadow: 0 2px 10px rgba(56,189,248,0.5);">لوحة معلومات المخزون</h2>
            </div>

            <!-- Right: Controls -->
            <div style="display:flex; align-items:center; gap:12px; flex:1; justify-content:flex-end;">
                <!-- Clock -->
                <div style="display:flex; flex-direction:column; align-items:center; background:rgba(15,23,42,0.6); padding:6px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.08); min-width:110px;">
                    <span id="header-clock" style="color:#38bdf8; font-size:1.1rem; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:1px; text-shadow: 0 0 10px rgba(56,189,248,0.5);">00:00:00</span>
                    <span id="header-date-mini" style="color:var(--text-secondary); font-size:0.65rem; margin-top:1px;">جاري التحميل...</span>
                </div>
                <!-- Theme -->
                <div style="display:flex; align-items:center; gap:8px;">
                    <button class="theme-toggle-btn" style="background:rgba(255,255,255,0.1); border:none; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.1rem; color:var(--text-primary); transition:0.2s;" title="تبديل المظهر">🌗</button>
                    <button class="back-arrow-btn" onclick="history.back()" style="background:rgba(255,255,255,0.1); border:none; border-radius:12px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.1rem; color:var(--text-primary); transition:0.2s;" title="رجوع">🔙</button>
                </div>
            </div>
        </header>

    <div class="search-container">
        <input type="text" class="search-input" placeholder="ابحث عن صنف (الاسم، الباركود...)" id="search-box">
    </div>

    <div class="inventory-list" id="inventory-container">
        <!-- Will be populated by JS -->
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="js/app.js?v=20260616_2"></script>
    <script>
        document.addEventListener('DBReady', () => {
            const searchBox = document.getElementById('search-box');
            const container = document.getElementById('inventory-container');

            // Fetch function (now calling the real Backend API)
            const fetchInventory = async (query) => {
                try {
                    container.innerHTML = '<div class="no-results">جاري التحميل...</div>';
                    
                    // In a real scenario, we'd encode the query
                    const url = query 
                        ? \`http://localhost:3000/api/v1/inventory/search/\${encodeURIComponent(query)}\`
                        : \`http://localhost:3000/api/v1/inventory/search/all\`; // Assuming 'all' returns everything
                    
                    const response = await fetch(url, {
                        headers: {
                            'x-device-uuid': 'DEV-MODE-2026' // Bypass enabled in Dev Mode
                        }
                    });

                    if (!response.ok) throw new Error('Network response was not ok');
                    return await response.json();
                } catch (error) {
                    console.error('Fetch error:', error);
                    return [];
                }
            };

            const renderData = (data) => {
                container.innerHTML = '';
                if (data.length === 0) {
                    container.innerHTML = '<div class="no-results">لا توجد أصناف تطابق بحثك</div>';
                    return;
                }

                data.forEach(item => {
                    const availablePercent = (item.available / item.physical) * 100;
                    const card = document.createElement('div');
                    card.className = 'inventory-card glass-panel';
                    card.innerHTML = \`
                        <div class="product-info">
                            <div class="product-name">\${item.name}</div>
                            <div class="product-sku">\${item.sku}</div>
                        </div>
                        <div class="balance-grid">
                            <div class="balance-item">
                                <span class="balance-val val-physical">\${item.physical.toLocaleString()}</span>
                                <span class="balance-label">الفعلي</span>
                            </div>
                            <div class="balance-item">
                                <span class="balance-val val-reserved">\${item.reserved.toLocaleString()}</span>
                                <span class="balance-label">المحجوز</span>
                            </div>
                            <div class="balance-item">
                                <span class="balance-val val-available">\${item.available.toLocaleString()}</span>
                                <span class="balance-label">المتوفر</span>
                            </div>
                        </div>
                        <div class="stock-progress-container">
                            <div class="stock-progress-bar" style="width: \${availablePercent}%"></div>
                        </div>
                    \`;
                    container.appendChild(card);
                });
            };

            // Initial Load
            fetchInventory('').then(renderData);

            // Search logic
            searchBox.addEventListener('input', (e) => {
                fetchInventory(e.target.value).then(renderData);
            });
        });
    </script>
</body>
</html>
