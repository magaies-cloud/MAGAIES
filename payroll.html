<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الرواتب والأجور | السجانة ERP</title>
    <link rel="stylesheet" href="css/design-system.css"><link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css?v=20260626_4">
        <style>
        .container { padding: 20px; padding-bottom: 100px; }

        /* -- Month Selector -- */
        .month-bar {
            display: flex; align-items: center; gap: 10px;
            background: var(--surface-color); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 12px 16px; margin-bottom: 20px;
        }
        .month-bar label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
        .month-bar input { flex: 1; background: var(--bg-color); border: 1px solid var(--glass-border); color: var(--text-primary); padding: 8px 12px; border-radius: 8px; }

        /* -- Summary Cards -- */
        .summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .sum-card {
            padding: 16px; border-radius: 12px; text-align: center;
            background: var(--surface-color); border: 1px solid var(--glass-border);
        }
        .sum-label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 6px; }
        .sum-value { font-size: 1.2rem; font-weight: 900; }

        /* -- Employee Cards -- */
        .employee-card {
            padding: 16px; margin-bottom: 12px; border-radius: 12px;
            background: var(--surface-color); border: 1px solid var(--glass-border);
            border-right: 4px solid var(--primary-accent);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .employee-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
        .emp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .emp-name { font-weight: 800; font-size: 1rem; color: var(--text-primary); }
        .emp-role { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        .emp-status { font-size: 0.7rem; padding: 3px 8px; border-radius: 10px; font-weight: 700; }
        .emp-status.paid { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
        .emp-status.unpaid { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }

        .emp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .emp-field { font-size: 0.78rem; }
        .emp-field-label { color: var(--text-secondary); display: block; margin-bottom: 2px; }
        .emp-field-value { font-weight: 700; color: var(--text-primary); }
        .emp-field-value.green { color: #34d399; }
        .emp-field-value.red { color: #f87171; }

        .btn-pay {
            width: 100%; padding: 10px; border-radius: 8px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; border: none; font-weight: 800; cursor: pointer;
            font-size: 0.85rem; transition: opacity 0.2s;
        }
        .btn-pay:hover { opacity: 0.85; }
        .btn-pay:disabled { background: var(--glass-border); cursor: not-allowed; color: var(--text-muted); opacity: 0.6; }
        .btn-pay.paid-btn { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }

        /* -- Add Employee -- */
        .add-emp-section { margin-bottom: 20px; }
        .btn-add-emp {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 18px; border-radius: 10px;
            background: rgba(56,189,248,0.1); color: var(--primary-accent);
            border: 1px solid rgba(56,189,248,0.3); font-weight: 700; cursor: pointer;
            font-size: 0.85rem; transition: all 0.2s;
        }
        .btn-add-emp:hover { background: rgba(56,189,248,0.2); }

        /* -- Modal Styles -- */
        .pay-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            z-index: 9999; justify-content: center; align-items: center;
        }
        .pay-modal-overlay.show { display: flex; }
        .pay-modal {
            background: var(--surface-color); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 24px; width: 90%; max-width: 460px;
        }
        .pay-modal h3 { margin: 0 0 18px; font-size: 1.1rem; color: var(--primary-accent); }
        .pay-modal .form-group { margin-bottom: 14px; }
        .pay-modal label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 5px; font-weight: 600; }
        .pay-modal input, .pay-modal select {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            border: 1px solid var(--glass-border); background: var(--bg-color);
            color: var(--text-primary); box-sizing: border-box; font-size: 0.9rem;
        }
        .pay-modal-btns { display: flex; gap: 10px; margin-top: 18px; }
        .btn-confirm-pay {
            flex: 1; padding: 12px; border-radius: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; border: none; font-weight: 800; cursor: pointer;
        }
        .btn-cancel-pay {
            padding: 12px 20px; border-radius: 10px;
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--glass-border); cursor: pointer;
        }

        @media (max-width: 600px) {
            .summary-row { grid-template-columns: 1fr; }
            .emp-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <!-- Ambient Animated Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <nav class="navbar glass-panel">
        <button class="back-btn" onclick="history.back()">🔙</button>
        <h1 class="brand-title">الرواتب والأجور</h1>
        <div style="width: 30px;"></div>
    </nav>

    <div class="container">

        <!-- اختر الشهر والسنة -->
        <div class="month-bar">
            <label>عن شهر الدفع:</label>
            <input type="month" id="payroll-month">
            <button class="btn-add-emp" onclick="loadPayroll()" style="white-space:nowrap;">تحديث</button>
        </div>

        <!-- إجمالي الرواتب -->
        <div class="summary-row">
            <div class="sum-card glass-panel">
                <div class="sum-label">إجمالي الرواتب</div>
                <div class="sum-value" id="total-gross" style="color: var(--primary-accent);">0 SDG</div>
            </div>
            <div class="sum-card glass-panel">
                <div class="sum-label">تم دفعه</div>
                <div class="sum-value" id="total-paid" style="color: #34d399;">0 SDG</div>
            </div>
            <div class="sum-card glass-panel">
                <div class="sum-label">المتبقي</div>
                <div class="sum-value" id="total-remaining" style="color: #f87171;">0 SDG</div>
            </div>
        </div>

        <!-- إضافة موظف جديد -->
        <div class="add-emp-section">
            <button class="btn-add-emp" onclick="openAddEmployee()">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                + إضافة موظف
            </button>
        </div>

        <!-- قائمة الموظفين -->
        <h3 style="margin-bottom: 15px; color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em;">
            لا يوجد موظفين
        </h3>
        <div id="employees-container"></div>
    </div>

    <!-- تسجيل دفع الراتب -->
    <div class="pay-modal-overlay" id="pay-modal">
        <div class="pay-modal glass-panel">
            <h3>تسجيل دفع راتب الموظف</h3>
            <div class="form-group">
                <label>اسم الموظف</label>
                <input type="text" id="pay-emp-name" readonly>
            </div>
            <div class="form-group">
                <label>الراتب الأساسي</label>
                <input type="number" id="pay-basic" oninput="calcNetPay()">
            </div>
            <div class="form-group">
                <label>البدلات والمكافآت (+)</label>
                <input type="number" id="pay-allowance" value="0" oninput="calcNetPay()">
            </div>
            <div class="form-group">
                <label>الاستقطاعات (-)</label>
                <input type="number" id="pay-deductions" value="0" oninput="calcNetPay()">
            </div>
            <div class="form-group">
                <label>الصافي المستحق</label>
                <input type="number" id="pay-net" readonly style="font-weight: 900; font-size: 1.1rem; color: #34d399;">
            </div>
            <div class="form-group">
                <label>الخزينة / طريقة الدفع</label>
                <select id="pay-account"></select>
            </div>
            <div class="form-group">
                <label>ملاحظات</label>
                <input type="text" id="pay-notes" placeholder="أي ملاحظات...">
            </div>
            <input type="hidden" id="pay-emp-id">
            <div class="pay-modal-btns">
                <button class="btn-cancel-pay" onclick="closePayModal()">إلغاء</button>
                <button class="btn-confirm-pay" onclick="confirmPaySalary()">✓ اعتماد الدفع</button>
            </div>
        </div>
    </div>

    <!-- إضافة موظف جديد -->
    <div class="pay-modal-overlay" id="add-emp-modal">
        <div class="pay-modal glass-panel">
            <h3>إضافة موظف جديد</h3>
            <div class="form-group">
                <label>اسم الموظف الثلاثي</label>
                <input type="text" id="new-emp-name" placeholder="اسم الموظف">
            </div>
            <div class="form-group">
                <label>المسمى الوظيفي</label>
                <input type="text" id="new-emp-role" placeholder="مثال: محاسب مالي...">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="new-emp-phone" placeholder="+249...">
            </div>
            <div class="form-group">
                <label>الراتب الأساسي الشهري (SDG)</label>
                <input type="number" id="new-emp-salary" placeholder="0">
            </div>
            <div class="form-group">
                <label>تاريخ التعيين</label>
                <input type="date" id="new-emp-join-date">
            </div>
            <div class="pay-modal-btns">
                <button class="btn-cancel-pay" onclick="closeAddEmployee()">إلغاء</button>
                <button class="btn-confirm-pay" onclick="saveNewEmployee()">✓ حفظ</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="js/app.js?v=20260626_4"></script>
    <script>
        let currentMonth = '';
        let employees = [];
        let payrollRecords = []; // erp_payroll_v1: [{empId, month, basic, allowance, deductions, net, accountId, notes, paidAt}]

        document.addEventListener('DBReady', () => {
            // Set current month
            const now = new Date();
            const yr  = now.getFullYear();
            const mo  = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('payroll-month').value = \`\${yr}-\${mo}\`;
            loadPayroll();
        });

        function loadPayroll() {
            currentMonth = document.getElementById('payroll-month').value;
            // Load from dedicated employees table (separate from system users)
            employees    = JSON.parse(localStorage.getItem('erp_employees_v1') || '[]');
            payrollRecords = JSON.parse(localStorage.getItem('erp_payroll_v1') || '[]');

            renderEmployees();
            updateSummary();
        }

        function renderEmployees() {
            const container = document.getElementById('employees-container');
            if (employees.length === 0) {
                container.innerHTML = \`
                    <div style="text-align:center; padding:40px; color:var(--text-secondary);">
                        <div style="font-size:3rem; margin-bottom:16px;">👥</div>
                        <p>لا توجد بيانات موظفين مسجلة.</p>
                        <p style="font-size:0.85rem;">اضغط "إضافة موظف جديد" للبدء.</p>
                    </div>\`;
                return;
            }

            container.innerHTML = employees.map(emp => {
                const rec    = payrollRecords.find(r => r.empId === emp.id && r.month === currentMonth);
                const isPaid = !!rec;
                const net    = isPaid ? rec.net : emp.salary || 0;

                return \`
                <div class="employee-card glass-panel">
                    <div class="emp-header">
                        <div>
                            <div class="emp-name">\${emp.name}</div>
                            <div class="emp-role">\${emp.role || 'موظف'}</div>
                        </div>
                        <span class="emp-status \${isPaid ? 'paid' : 'unpaid'}">
                            \${isPaid ? '✓ مدفوع' : '✗ غير مدفوع'}
                        </span>
                    </div>
                    <div class="emp-grid">
                        <div class="emp-field">
                            <span class="emp-field-label">الراتب الأساسي</span>
                            <span class="emp-field-value">\${(emp.salary || 0).toLocaleString()} SDG</span>
                        </div>
                        <div class="emp-field">
                            <span class="emp-field-label">الصافي المستحق</span>
                            <span class="emp-field-value \${isPaid ? 'green' : ''}">\${isPaid ? net.toLocaleString() + ' SDG' : '-'}</span>
                        </div>
                        <div class="emp-field">
                            <span class="emp-field-label">حالة الدفع</span>
                            <span class="emp-field-value">\${isPaid ? new Date(rec.paidAt).toLocaleDateString('ar-SD') : '-'}</span>
                        </div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-pay \${isPaid ? 'paid-btn' : ''}"
                            onclick="openPayModal('\${emp.id}', '\${emp.name}', \${emp.salary || 0})"
                            \${isPaid ? 'disabled' : ''}>
                            \${isPaid ? 'تم الدفع' : 'تسجيل دفع الراتب'}
                        </button>
                        <button onclick="deleteEmployee('\${emp.id}')"
                            style="padding:10px; border-radius:8px; background:rgba(239,68,68,0.1); color:#f87171; border:1px solid rgba(239,68,68,0.3); cursor:pointer;" title="حذف">
                            🗑️
                        </button>
                    </div>
                </div>\`;
            }).join('');
        }

        function updateSummary() {
            const totalGross = employees.reduce((s, e) => s + (e.salary || 0), 0);
            const monthRecords = payrollRecords.filter(r => r.month === currentMonth);
            const totalPaid  = monthRecords.reduce((s, r) => s + (r.net || 0), 0);
            const remaining  = employees
                .filter(emp => !monthRecords.find(r => r.empId === emp.id))
                .reduce((s, e) => s + (e.salary || 0), 0);

            const fmt = n => n.toLocaleString('en-US') + ' SDG';
            document.getElementById('total-gross').textContent     = fmt(totalGross);
            document.getElementById('total-paid').textContent      = fmt(totalPaid);
            document.getElementById('total-remaining').textContent = fmt(remaining);
        }

        // --- Pay Modal ---------------------------------------------
        function openPayModal(empId, empName, basicSalary) {
            document.getElementById('pay-emp-id').value   = empId;
            document.getElementById('pay-emp-name').value = empName;
            document.getElementById('pay-basic').value    = basicSalary;
            document.getElementById('pay-allowance').value  = 0;
            document.getElementById('pay-deductions').value = 0;
            document.getElementById('pay-notes').value = '';
            calcNetPay();

            // Load cash accounts
            const banks = JSON.parse(localStorage.getItem('erp_banks_v1') || '[]');
            const sel = document.getElementById('pay-account');
            sel.innerHTML = banks.filter(b => b.type === 'safe')
                .map(b => \`<option value="\${b.id}">\${b.name}</option>\`).join('');
            if (sel.options.length === 0) {
                sel.innerHTML = '<option value="default">الخزينة الرئيسية</option>';
            }

            document.getElementById('pay-modal').classList.add('show');
        }

        function closePayModal() {
            document.getElementById('pay-modal').classList.remove('show');
        }

        function calcNetPay() {
            const basic      = parseFloat(document.getElementById('pay-basic').value)      || 0;
            const allowance  = parseFloat(document.getElementById('pay-allowance').value)  || 0;
            const deductions = parseFloat(document.getElementById('pay-deductions').value) || 0;
            document.getElementById('pay-net').value = basic + allowance - deductions;
        }

        function confirmPaySalary() {
            const empId    = document.getElementById('pay-emp-id').value;
            const basic    = parseFloat(document.getElementById('pay-basic').value)      || 0;
            const allow    = parseFloat(document.getElementById('pay-allowance').value)  || 0;
            const deduct   = parseFloat(document.getElementById('pay-deductions').value) || 0;
            const net      = basic + allow - deduct;
            const accountId = document.getElementById('pay-account').value;
            const notes    = document.getElementById('pay-notes').value.trim();

            if (!empId) return;

            // Save payroll record
            const record = {
                id: 'pay_' + Date.now(),
                empId,
                month: currentMonth,
                basic,
                allowance: allow,
                deductions: deduct,
                net,
                accountId,
                notes,
                paidAt: new Date().toISOString()
            };

            payrollRecords.push(record);
            localStorage.setItem('erp_payroll_v1', JSON.stringify(payrollRecords));

            // Deduct from cash account balance
            const banks = JSON.parse(localStorage.getItem('erp_banks_v1') || '[]');
            const accIdx = banks.findIndex(b => b.id === accountId);
            if (accIdx > -1) {
                banks[accIdx].balance = (parseFloat(banks[accIdx].balance) || 0) - net;
                localStorage.setItem('erp_banks_v1', JSON.stringify(banks));
            }

            // Audit log
            const emp = employees.find(e => e.id === empId);
            if (window.logSystemAction) {
                window.logSystemAction('Payroll', 'finance', \`صرف راتب \${emp?.name || empId} بقيمة \${net.toLocaleString()} SDG لشهر \${currentMonth}\`);
            }

            closePayModal();
            loadPayroll();

            if (window.showToast) {
                window.showToast(\`✓ تم دفع راتب \${emp?.name || ''} بنجاح\`, 'success');
            }
        }

        // --- Add Employee ------------------------------------------
        function openAddEmployee() {
            document.getElementById('new-emp-name').value = '';
            document.getElementById('new-emp-role').value = '';
            document.getElementById('new-emp-phone').value = '';
            document.getElementById('new-emp-salary').value = '';
            document.getElementById('new-emp-join-date').value = new Date().toISOString().slice(0,10);
            document.getElementById('add-emp-modal').classList.add('show');
        }

        function closeAddEmployee() {
            document.getElementById('add-emp-modal').classList.remove('show');
        }

        function saveNewEmployee() {
            const name = document.getElementById('new-emp-name').value.trim();
            if (!name) { alert('الرجاء إدخال اسم الموظف'); return; }

            const emp = {
                id:       'emp_' + Date.now(),
                name,
                role:     document.getElementById('new-emp-role').value.trim(),
                phone:    document.getElementById('new-emp-phone').value.trim(),
                salary:   parseFloat(document.getElementById('new-emp-salary').value) || 0,
                joinDate: document.getElementById('new-emp-join-date').value,
                status:   'active'
            };

            employees.push(emp);
            localStorage.setItem('erp_employees_v1', JSON.stringify(employees));
            closeAddEmployee();
            loadPayroll();

            if (window.logSystemAction) {
                window.logSystemAction('Employee Add', 'finance', \`تم إضافة الموظف \${name}\`);
            }
        }

        function deleteEmployee(empId) {
            if (!confirm('هل أنت متأكد من حذف الموظف؟')) return;
            employees = employees.filter(e => e.id !== empId);
            localStorage.setItem('erp_employees_v1', JSON.stringify(employees));
            loadPayroll();
        }
    </script>
</body>
</html>
