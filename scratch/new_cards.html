    <!-- SUMMARY CARDS -->
    <style>
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .crystal-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px 25px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            cursor: default;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }
        
        .crystal-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0%, rgba(255,255,255,0.15) 10%, transparent 20%);
            animation: crystal-spin 6s linear infinite;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .crystal-card:hover {
            transform: translateY(-8px) scale(1.03);
            z-index: 10;
        }
        .crystal-card:hover::before {
            opacity: 1;
        }

        @keyframes crystal-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Ambient glowing background specific to each card */
        .card-debit { background: linear-gradient(135deg, rgba(6, 78, 59, 0.4), rgba(4, 120, 87, 0.5)); border-color: rgba(16, 185, 129, 0.3); }
        .card-debit:hover { box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4), inset 0 2px 4px rgba(255,255,255,0.3); border-color: rgba(16, 185, 129, 0.6); }

        .card-credit { background: linear-gradient(135deg, rgba(127, 29, 29, 0.4), rgba(185, 28, 28, 0.5)); border-color: rgba(239, 68, 68, 0.3); }
        .card-credit:hover { box-shadow: 0 15px 35px rgba(239, 68, 68, 0.4), inset 0 2px 4px rgba(255,255,255,0.3); border-color: rgba(239, 68, 68, 0.6); }

        .card-balance { background: linear-gradient(135deg, rgba(49, 46, 129, 0.4), rgba(79, 70, 229, 0.5)); border-color: rgba(99, 102, 241, 0.3); }
        .card-balance:hover { box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4), inset 0 2px 4px rgba(255,255,255,0.3); border-color: rgba(99, 102, 241, 0.6); }

        .s-label {
            font-size: 1.05rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-debit .s-label { color: #6ee7b7; text-shadow: 0 0 10px rgba(110, 231, 183, 0.5); }
        .card-credit .s-label { color: #fca5a5; text-shadow: 0 0 10px rgba(252, 165, 165, 0.5); }
        .card-balance .s-label { color: #a5b4fc; text-shadow: 0 0 10px rgba(165, 180, 252, 0.5); }

        .values-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 5px;
            gap: 15px;
            position: relative;
        }

        .values-container::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 10%;
            bottom: 10%;
            width: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        .val-local, .val-usd {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .val-usd {
            align-items: flex-end;
            text-align: left;
        }

        .val-currency {
            font-size: 0.8rem;
            opacity: 0.7;
            font-weight: 600;
        }

        .s-val {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.1;
        }
        
        .s-val-foreign {
            font-size: 1.3rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .card-debit .s-val-foreign { color: #a7f3d0; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
        .card-credit .s-val-foreign { color: #fecaca; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
        .card-balance .s-val-foreign { color: #c7d2fe; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }

    </style>
    <div class="summary-cards" id="summary-cards" style="display:none;">
        <!-- Debit Card -->
        <div class="crystal-card card-debit">
            <div class="s-label">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2v20m-7-7l7 7 7-7"/></svg>
                إجمالي المدين
            </div>
            <div class="values-container">
                <div class="val-local">
                    <span class="val-currency">الجنيه السوداني</span>
                    <span class="s-val td-debit" id="sum-debit">0.00</span>
                </div>
                <div class="val-usd">
                    <span class="val-currency">الدولار الأمريكي</span>
                    <span class="s-val-foreign" id="sum-debit-foreign">0.00</span>
                </div>
            </div>
        </div>
        <!-- Credit Card -->
        <div class="crystal-card card-credit">
            <div class="s-label">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 22V2m-7 7l7-7 7 7"/></svg>
                إجمالي الدائن
            </div>
            <div class="values-container">
                <div class="val-local">
                    <span class="val-currency">الجنيه السوداني</span>
                    <span class="s-val td-credit" id="sum-credit">0.00</span>
                </div>
                <div class="val-usd">
                    <span class="val-currency">الدولار الأمريكي</span>
                    <span class="s-val-foreign" id="sum-credit-foreign">0.00</span>
                </div>
            </div>
        </div>
        <!-- Balance Card -->
        <div class="crystal-card card-balance">
            <div class="s-label">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 3v18h18M9 9l4 4 6-6"/></svg>
                الرصيد محلي
            </div>
            <div class="values-container">
                <div class="val-local">
                    <span class="val-currency">الجنيه السوداني</span>
                    <span class="s-val" id="sum-balance">0.00</span>
                </div>
                <div class="val-usd">
                    <span class="val-currency">الدولار الأمريكي</span>
                    <span class="s-val-foreign" id="sum-balance-foreign">0.00</span>
                </div>
            </div>
        </div>
    </div>
