name: Deploy to Live Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: '147.182.214.194'
        username: 'root'
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 22
        script: |
          cd /var/www/magaees
          git remote set-url origin https://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@github.com/magaies-cloud/MAGAIES.git
          git pull origin main
          chown -R www-data:www-data /var/www/magaees
          chmod -R 755 /var/www/magaees
          systemctl reload nginx
