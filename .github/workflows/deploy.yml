name: Deploy to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v0.1.10
      timeout-minutes: 10
      with:
        host: '147.182.214.194'
        username: 'root'
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 22
        command_timeout: 5m
        debug: true
        script: |
          # 1. Free disk space immediately so git & MySQL never hit Out of diskspace
          rm -f /var/www/magaees/.git/index.lock 2>/dev/null || true
          journalctl --vacuum-size=50M 2>/dev/null || true
          apt-get clean 2>/dev/null || true
          find /var/log -type f \( -name "*.gz" -o -name "*.1" -o -name "*.2" -o -name "*.old" \) -delete 2>/dev/null || true
          truncate -s 0 /var/log/syslog /var/log/kern.log /var/log/auth.log /var/log/btmp /var/log/wtmp /var/log/nginx/*.log /var/www/magaees/*.log 2>/dev/null || true
          rm -rf /var/www/magaees/baileys_auth_*_trash_* /tmp/magaiees_* /tmp/.npm-cache /root/.npm/_cacache 2>/dev/null || true
          find /var/www/magaees/backups -type f \( -name "*.sql" -o -name "*.zip" \) -mtime +2 -delete 2>/dev/null || true
          df -h /

          # 2. Fast Git sync to origin/main
          cd /var/www/magaees
          sed -i "/insteadOf/d" /var/www/magaees/.git/config || true
          git remote set-url origin https://github.com/magaies-cloud/MAGAIES.git
          git config core.autocrlf false || true
          git config core.fileMode false || true
          git update-index --no-skip-worktree whatsapp-service.mjs || true
          chmod 644 whatsapp-service.mjs || true
          git fetch origin main --depth=5
          git checkout -f origin/main
          git reset --hard origin/main

          # 3. Ensure OCR engine, sudoers permissions & clean 0-byte corrupted auth files
          find /var/www/magaees/baileys_auth_* -maxdepth 1 -name "creds.json" -size 0 -delete 2>/dev/null || true
          echo "www-data ALL=(root) NOPASSWD: /usr/bin/pkill, /bin/fuser, /usr/bin/fuser" > /etc/sudoers.d/magaees-wa
          chmod 440 /etc/sudoers.d/magaees-wa
          mkdir -p /var/www/magaees/uploads/.ocr_engine /var/www/magaees/uploads/ocr_cache
          if [ ! -d "/var/www/magaees/node_modules/tesseract.js" ] && [ ! -d "/var/www/magaees/uploads/.ocr_engine/node_modules/tesseract.js" ]; then
            npm install --prefix /var/www/magaees/uploads/.ocr_engine tesseract.js@7.0.0 --no-package-lock --cache /tmp/.npm-cache --no-audit --no-fund 2>&1 || true
          fi
          chown -R www-data:www-data /var/www/magaees
          chmod -R 755 /var/www/magaees
          chmod -R 777 /var/www/magaees/uploads/.ocr_engine /var/www/magaees/uploads/ocr_cache 2>/dev/null || true
          php /var/www/magaees/api/migrate_ui_preferences.php 2>/dev/null || true
          pkill -9 -f "[w]hatsapp-service" || true
          pkill -9 -f "[n]ode-ocr" || true
          pkill -9 -f "[n]ode.*server\.js" || true
          fuser -k -9 3001/tcp 2>/dev/null || true
          sleep 1
          curl -s "http://127.0.0.1/api_index.php?r=wa-tenant&endpoint=status&userId=wa_tenant_12&local_only=1" >/dev/null 2>&1 || true

          # ================================================
          # PERMANENT FIX: SSL + Redirect for ALL www.*.elsajana.com
          # Automatically covers every tenant subdomain
          # Uses certbot DNS-01 challenge via Cloudflare API
          # ================================================
          
          # Install certbot cloudflare plugin if not present
          dpkg -l python3-certbot-dns-cloudflare > /dev/null 2>&1 || apt-get install -y python3-certbot-dns-cloudflare > /dev/null 2>&1 || true

          # Create Cloudflare credentials file
          mkdir -p /etc/letsencrypt/cloudflare
          cat > /etc/letsencrypt/cloudflare/credentials.ini << 'CRED'
          dns_cloudflare_api_token = cfut_z3Uk7prLhfKyYLDFeFZWBAlYQVpjmfu0Ft4ZcPlX6c16c17a
          CRED
          chmod 600 /etc/letsencrypt/cloudflare/credentials.ini

          # Auto-discover ALL tenant subdomains from existing Let's Encrypt certs
          # Only run certbot loop if www-all-elsajana-redirect is not yet configured
          if [ ! -f /etc/nginx/sites-available/www-all-elsajana-redirect ]; then
            CERT_DOMAINS=""
            for CERT_DIR in /etc/letsencrypt/live/*.elsajana.com; do
              [ -d "$CERT_DIR" ] || continue
              SUBDOMAIN=$(basename "$CERT_DIR")
              echo "$SUBDOMAIN" | grep -q "^www\." && continue
              [ "$SUBDOMAIN" = "elsajana.com" ] && continue
              certbot certonly \
                --dns-cloudflare \
                --dns-cloudflare-credentials /etc/letsencrypt/cloudflare/credentials.ini \
                -d "$SUBDOMAIN" \
                -d "www.$SUBDOMAIN" \
                --non-interactive \
                --agree-tos \
                --email Magaiees00105@gmail.com \
                --cert-name "$SUBDOMAIN" \
                --keep-until-expiring \
                2>/dev/null || true
            done
          fi

          # Create ONE Nginx config with regex that handles ALL www.*.elsajana.com
          cat > /etc/nginx/sites-available/www-all-elsajana-redirect << 'NGINX_BLOCK'
          # HTTP: Redirect ALL www.X.elsajana.com -> X.elsajana.com
          server {
              listen 80;
              server_name ~^www\.(?<tenant>.+)\.elsajana\.com$;
              return 301 https://$tenant.elsajana.com$request_uri;
          }
          
          # HTTPS: Redirect ALL www.X.elsajana.com -> X.elsajana.com
          # Uses ssl_certificate_by_lua or SNI-based cert selection
          server {
              listen 443 ssl;
              server_name ~^www\.(?<tenant>.+)\.elsajana\.com$;
          
              # Default cert (will be overridden by SNI if tenant-specific cert exists)
              ssl_certificate /etc/letsencrypt/live/c.elsajana.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/c.elsajana.com/privkey.pem;
          
              return 301 https://$tenant.elsajana.com$request_uri;
          }
          NGINX_BLOCK
          ln -sf /etc/nginx/sites-available/www-all-elsajana-redirect /etc/nginx/sites-enabled/www-all-elsajana-redirect
          # Remove old single-tenant config if exists
          rm -f /etc/nginx/sites-available/www-c-elsajana-redirect /etc/nginx/sites-enabled/www-c-elsajana-redirect 2>/dev/null || true

          nginx -t && systemctl reload nginx
