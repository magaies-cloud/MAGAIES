name: Deploy to Live Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: '147.182.214.194'
        username: 'root'
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 22
        script: |
          cd /var/www/magaees
          git remote set-url origin https://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@github.com/magaies-cloud/magaies.git
          git update-index --no-skip-worktree whatsapp-service.mjs || true
          chmod 644 whatsapp-service.mjs || true
          git fetch origin
          git reset --hard origin/main
          git clean -fd
          git update-index --skip-worktree whatsapp-service.mjs || true
          chmod 444 whatsapp-service.mjs || true
          chown -R www-data:www-data /var/www/magaees
          chmod -R 755 /var/www/magaees
          pkill -f "whatsapp-service\.(mjs|js)" || true

          # ================================================
          # PERMANENT FIX: Redirect www.c.elsajana.com -> c.elsajana.com
          # Step 1: Expand SSL cert to cover www.c.elsajana.com
          # Step 2: Create Nginx redirect server block
          # This runs on EVERY deploy to guarantee the fix persists.
          # ================================================
          
          # Step 1: Expand cert to include www.c.elsajana.com
          certbot --nginx --expand -d c.elsajana.com -d www.c.elsajana.com --non-interactive --agree-tos --redirect 2>/dev/null || true

          # Step 2: Ensure Nginx redirect config exists
          NGINX_WWW_CONF="/etc/nginx/sites-available/www-c-elsajana-redirect"
          cat > "$NGINX_WWW_CONF" << 'NGINX_BLOCK'
server {
    listen 80;
    server_name www.c.elsajana.com;
    return 301 https://c.elsajana.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.c.elsajana.com;

    # Use the expanded cert (covers both c. and www.c.)
    ssl_certificate /etc/letsencrypt/live/c.elsajana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c.elsajana.com/privkey.pem;

    return 301 https://c.elsajana.com$request_uri;
}
NGINX_BLOCK
          ln -sf "$NGINX_WWW_CONF" /etc/nginx/sites-enabled/www-c-elsajana-redirect

          nginx -t && systemctl reload nginx
