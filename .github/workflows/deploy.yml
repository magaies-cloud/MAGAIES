name: Deploy to Live Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: '147.182.214.194'
        username: 'root'
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 22
        script: |
          cd /var/www/magaees
          git remote set-url origin https://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@github.com/magaies-cloud/magaies.git
          git update-index --no-skip-worktree whatsapp-service.mjs || true
          chmod 644 whatsapp-service.mjs || true
          git fetch origin
          git reset --hard origin/main
          git clean -fd
          git update-index --skip-worktree whatsapp-service.mjs || true
          chmod 444 whatsapp-service.mjs || true
          chown -R www-data:www-data /var/www/magaees
          chmod -R 755 /var/www/magaees
          pkill -f "whatsapp-service\.(mjs|js)" || true

          # ================================================
          # PERMANENT FIX: SSL + Redirect for www.c.elsajana.com
          # Uses certbot DNS-01 challenge via Cloudflare API
          # ================================================
          
          # Install certbot cloudflare plugin if not present
          dpkg -l python3-certbot-dns-cloudflare > /dev/null 2>&1 || apt-get install -y python3-certbot-dns-cloudflare > /dev/null 2>&1 || true

          # Create Cloudflare credentials file (restricted permissions)
          mkdir -p /etc/letsencrypt/cloudflare
          cat > /etc/letsencrypt/cloudflare/credentials.ini << 'CRED'
dns_cloudflare_api_token = cfut_z3Uk7prLhfKyYLDFeFZWBAlYQVpjmfu0Ft4ZcPlX6c16c17a
CRED
          chmod 600 /etc/letsencrypt/cloudflare/credentials.ini

          # Get/expand cert to cover www.c.elsajana.com via DNS-01 challenge
          certbot certonly \
            --dns-cloudflare \
            --dns-cloudflare-credentials /etc/letsencrypt/cloudflare/credentials.ini \
            -d c.elsajana.com \
            -d www.c.elsajana.com \
            --non-interactive \
            --agree-tos \
            --email Magaiees00105@gmail.com \
            --cert-name c.elsajana.com \
            --keep-until-expiring \
            2>/dev/null || true

          # Create Nginx redirect config
          cat > /etc/nginx/sites-available/www-c-elsajana-redirect << 'NGINX_BLOCK'
server {
    listen 80;
    server_name www.c.elsajana.com;
    return 301 https://c.elsajana.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.c.elsajana.com;
    ssl_certificate /etc/letsencrypt/live/c.elsajana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c.elsajana.com/privkey.pem;
    return 301 https://c.elsajana.com$request_uri;
}
NGINX_BLOCK
          ln -sf /etc/nginx/sites-available/www-c-elsajana-redirect /etc/nginx/sites-enabled/www-c-elsajana-redirect

          nginx -t && systemctl reload nginx
