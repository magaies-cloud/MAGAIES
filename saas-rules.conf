location ^~ /.well-known/acme-challenge/ {
    allow all;
    default_type "text/plain";
}

location ~* ^/(setup_db|test_db|schema)\.php$ { deny all; return 403; }
location ~ /\.env { deny all; return 403; }
location ~ /\.git { deny all; return 403; }
location ~ /\. { deny all; }
location ~* \.(pem|key|bat|sh)$ { deny all; return 403; }

location = / { return 302 /index.html; }

location ~ ^(/api_index\.php)(/.*)?$ {
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    fastcgi_split_path_info ^(/api_index\.php)(/?.+)$;
    fastcgi_param SCRIPT_FILENAME $document_root/api_index.php;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    include fastcgi_params;
}

location /api/ {
    try_files $uri $uri/ /api/index.php?$query_string;
}

location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}

location / { try_files $uri $uri/ =404; }
