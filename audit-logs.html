<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>السجانة 2026 - سجل النشاطات</title>
    <link rel="stylesheet" href="css/design-system.css?v=20260626_3"><link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css?v=20260626_3">
        <style>
        .audit-container { padding: 20px; padding-bottom: 100px; }
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .log-card {
            padding: 15px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            animation: fadeIn 0.4s ease-out;
            border-right: 4px solid var(--primary-accent);
        }
        .log-card.danger { border-right-color: var(--danger-color); }
        .log-card.success { border-right-color: var(--success-color); }
        
        .log-icon {
            font-size: 1.5rem;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 50%;
        }
        .log-content { flex: 1; }
        .log-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .log-user { font-weight: 800; color: var(--text-primary); }
        .log-time { font-size: 0.75rem; color: var(--text-secondary); }
        .log-action { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 5px; }
        .log-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-color);
            padding: 5px 10px;
            border-radius: 8px;
            display: inline-block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- Ambient Animated Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>


    <nav class="navbar glass-panel">
        <button class="back-btn" onclick="history.back()">➞</button>
        <h1 class="brand-title">سجل الرقابة والنشاطات</h1>
        <div style="width: 30px;"></div>
    </nav>

    <div class="audit-container">
        <div class="log-list" id="log-list">
            <!-- Populated dynamically via audit-logs.js -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="js/app.js?v=20260626_3"></script>
    <script src="js/audit-logs.js"></script>
</body>
</html>
