<!DOCTYPE html>
<html>
<head><title>Template Test</title></head>
<body>
<template id="test-template">
    <div data-id="{ID}">
        <button onclick="alert('{ID}')">Test {ID}</button>
        <div id="container-{ID}">Container</div>
    </div>
</template>
<div id="output"></div>
<script>
    const tpl = document.getElementById('test-template');
    const div = document.createElement('div');
    div.appendChild(tpl.content.cloneNode(true));
    const raw = div.innerHTML;
    console.log('RAW innerHTML:', raw);
    console.log('Has {ID}:', raw.includes('{ID}'));
    const replaced = raw.replace(/{ID}/g, 'TEST_123');
    console.log('REPLACED:', replaced);
    document.getElementById('output').innerHTML = '<pre>' + replaced.replace(/</g, '&lt;') + '</pre>';
    document.getElementById('output').insertAdjacentHTML('beforeend', replaced);
</script>
</body>
</html>
