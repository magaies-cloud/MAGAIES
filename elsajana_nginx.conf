server {
    if ($host = www.elsajana.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = elsajana.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name elsajana.com www.elsajana.com 147.182.214.194;
    root /var/www/magaees;
    index index.html login.html index.php;
    
    include /etc/nginx/snippets/saas-rules.conf;
}

server {
    listen 443 ssl;
    server_name elsajana.com www.elsajana.com;
    root /var/www/magaees;
    index index.html login.html index.php;
    
    ssl_certificate /etc/letsencrypt/live/elsajana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elsajana.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    include /etc/nginx/snippets/saas-rules.conf;
}
