        <style>
        .container { padding: 20px; padding-bottom: 100px; }

            display: flex;

        .tab-btn {

            color: var(--text-primary);

        .btn-add {

    <script>
        // Mock data for UI preview
        let localPartners = [
            { id: 1, name: '????? ??????? ?????????', type: 'CUSTOMER', phone: '0912345678' },
            { id: 2, name: '???? ?????? ??????', type: 'SUPPLIER', phone: '0123456789' },
            { id: 3, name: '???? ???? ??????', type: 'EMPLOYEE', phone: '0111111111' }
        ];

        document.addEventListener('DBReady', () => {
            if (!localStorage.getItem('authToken')) {
                window.location.href = 'login.html';
            }
            loadPartners('');
        });

        function loadPartners(filterType) {
            // Update active tab UI
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const container = document.getElementById('list-container');
            container.innerHTML = '';

            let filtered = localPartners;
            if (filterType) {
                filtered = localPartners.filter(p => p.type === filterType);
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center;">?? ???? ??????</div>';
                return;
            }

            filtered.forEach(p => {
                const typeLabel = p.type === 'CUSTOMER' ? '????' : p.type === 'SUPPLIER' ? '????' : '????';
                container.innerHTML += `
                    <div class="partner-card glass-panel">
                        <div>
                            <div class="partner-name">${p.name}</div>
                            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top:5px;">${p.phone || '?? ???? ????'}</div>
                        </div>
                        <div class="partner-type type-${p.type}">${typeLabel}</div>
                    </div>
                `;
            });
        }

        async function addPartner() {
            const name = document.getElementById('p-name').value;
            const type = document.getElementById('p-type').value;
            const phone = document.getElementById('p-phone').value;

            if (!name) {
                alert('??? ????? ?????');
                return;
            }

            // Mock backend call
            localPartners.unshift({
                id: Date.now(),
                name, type, phone
            });

            alert('?? ????? ?????!');
            document.getElementById('p-name').value = '';
            document.getElementById('p-phone').value = '';
            
            // Reload the currently active tab
            document.querySelector('.tab-btn.active').click();
        }
